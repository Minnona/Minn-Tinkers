name: Ascension DB Scrape

on:
  push:
    branches:
      - agent/ascension-db-scrape
    paths:
      - tools/inspect_ascension.py
      - tools/scrape_ascension.py
      - .github/workflows/ascension-db-scrape.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ascension-db-scrape
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Ascension class page
        run: python tools/inspect_ascension.py
      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascension-db-work/
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Capture Ascension DB HTML"
            git push
          fi
